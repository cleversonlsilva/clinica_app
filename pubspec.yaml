name: clinica_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.5.3
  http: ^1.5.0
  cupertino_icons: ^1.0.8

  # Notificações locais
  flutter_local_notifications: ^22.2.0
  flutter_timezone: ^5.1.0
  timezone: ^0.11.0

  # Visualização de PDF
  syncfusion_flutter_pdfviewer: ^34.2.4

  # Compartilhamento
  share_plus: ^13.3.0

  # Abertura de vídeos e links externos
  url_launcher: ^6.3.2

  # Localização
  geolocator: ^14.0.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # ==========================================================
  # ASSETS
  # ==========================================================
  #
  # Logo oficial do Nexo Saúde utilizada pelo aplicativo.
  #
  assets:
    - assets/images/nexo_saude.png