name: clinica_app
description: "A new Flutter project."

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number.
# In Android, build-name is used as versionName while build-number is used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+1

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs to work.
# To automatically upgrade your package dependencies, consider running
# `flutter pub upgrade --major-versions`.
dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.5.3
  http: ^1.5.0
  cupertino_icons: ^1.0.8

  # Notificações locais
  flutter_local_notifications: ^22.2.0
  flutter_timezone: ^5.1.0
  timezone: ^0.11.0
  syncfusion_flutter_pdfviewer: ^34.2.4
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints
  # activated in the analysis_options.yaml file.
  flutter_lints: ^6.0.0

# For information regarding this file, see:
# https://dart.dev/tools/pub/pubspec

flutter:

  # Ensures that the Material Icons font is included in the application.
  uses-material-design: true

  # To add assets to your application, add an assets section here:
  #
  # assets:
  #   - images/a_dot_burr.jpeg

  # An asset can refer to one or more resolution-specific variants.

  # To add custom fonts, use:
  #
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700